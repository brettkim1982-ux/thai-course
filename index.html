<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태국어 회화 자습 코스 (기본 8주 + 비즈니스 4주)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2230;--sub:#667085;--line:#e4e7ee;--brand:#1f3a8a;--brand2:#e11d48;--ok:#16a34a;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Thonburi",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--brand);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:18px}
header small{opacity:.8}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
nav button.on{background:#fff;color:var(--brand);font-weight:700}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:6px 0 10px;font-size:20px}
h3{margin:0 0 6px;font-size:16px}
.th{font-family:"Thonburi","Sukhumvit Set","Noto Sans Thai",sans-serif}
.big{font-size:26px;font-weight:600}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button.b{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
button.b.ghost{background:#eef1fb;color:var(--brand)}
button.b.red{background:var(--brand2)}
button.b.ok{background:var(--ok)}
button.ic{background:#eef1fb;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
button.ic.rec{background:#fee2e2}
select,input[type=checkbox]{font-size:14px}
select{padding:6px;border-radius:8px;border:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{flex:1}
.item .rom{color:var(--brand);font-size:14px}
.item .ko{color:#7c3aed;font-size:14px}
.item .mean{font-weight:600}
.item .note{color:var(--sub);font-size:13px}
.hide .rom,.hide .ko,.hide .mean{visibility:hidden}
.hide .item:hover .rom,.hide .item:hover .ko,.hide .item:hover .mean{visibility:visible}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700}
.mid{background:#dcfce7;color:#166534}.high{background:#fee2e2;color:#991b1b}.low{background:#dbeafe;color:#1e3a8a}
.tip{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt:hover{background:#f1f5f9}
.opt.good{background:#dcfce7;border-color:#16a34a}
.opt.bad{background:#fee2e2;border-color:#dc2626}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.weekhead{display:flex;justify-content:space-between;align-items:center}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;font-size:14px;vertical-align:top}
a{color:var(--brand)}
.dlg{padding:6px 0;display:flex;gap:10px;align-items:flex-start}
.dlg b{min-width:46px;color:var(--sub);font-size:13px}
@media(max-width:600px){.big{font-size:22px}}
</style>
</head>
<body>
<header>
  <h1>🇹🇭 태국어 회화 자습 코스 <small>기본 8주 + 비즈니스 4주</small></h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const DATA = {"lessons":[{"id":1,"title":"인사와 예의","goal":"만나고 헤어질 때, 감사·사과 표현","tip":"문장 끝에 남성은 크랍(ครับ), 여성은 카(ค่ะ/คะ)를 붙이면 정중해집니다. 질문은 여성이 '카'(คะ, 상승조 ká), 평서문은 '카'(ค่ะ, 하강조 kâ)로 성조가 다릅니다.","items":[{"th":"สวัสดีครับ","rom":"sà-wàt-dii kráp","ko":"사왓디 크랍","mean":"안녕하세요 (남성)","note":"여성은 สวัสดีค่ะ (사왓디 카)"},{"th":"สวัสดีค่ะ","rom":"sà-wàt-dii kâ","ko":"사왓디 카","mean":"안녕하세요 (여성)"},{"th":"สบายดีไหม","rom":"sà-baai dii mǎi","ko":"사바이 디 마이","mean":"잘 지내요?"},{"th":"สบายดี ขอบคุณครับ","rom":"sà-baai dii kɔ̀ɔp-kun kráp","ko":"사바이 디 컵쿤 크랍","mean":"잘 지내요, 감사합니다"},{"th":"ขอบคุณครับ","rom":"kɔ̀ɔp-kun kráp","ko":"컵쿤 크랍","mean":"감사합니다 (남성)","note":"여성은 ขอบคุณค่ะ"},{"th":"ขอบคุณค่ะ","rom":"kɔ̀ɔp-kun kâ","ko":"컵쿤 카","mean":"감사합니다 (여성)"},{"th":"ขอโทษครับ","rom":"kɔ̌ɔ-tôot kráp","ko":"커-토트 크랍","mean":"죄송합니다 / 실례합니다"},{"th":"ไม่เป็นไรครับ","rom":"mâi bpen rai kráp","ko":"마이 뻰 라이 크랍","mean":"괜찮아요 / 천만에요"},{"th":"ยินดีที่ได้รู้จักครับ","rom":"yin-dii tîi dâai rúu-jàk kráp","ko":"인디 티 다이 루-짝 크랍","mean":"만나서 반갑습니다"},{"th":"แล้วพบกันใหม่ครับ","rom":"léeo póp gan mài kráp","ko":"래우 폽 깐 마이 크랍","mean":"또 만나요"},{"th":"ลาก่อนครับ","rom":"laa gɔ̀ɔn kráp","ko":"라 껀 크랍","mean":"안녕히 가세요 / 안녕히 계세요"},{"th":"ไม่","rom":"mâi","ko":"마이","mean":"아니다 / ~하지 않다","note":"동사 앞에 붙여 부정"}]},{"id":2,"title":"자기소개","goal":"이름, 국적, 직업, 방문 목적 말하기","tip":"'저'는 남성 ผม(폼), 여성 ฉัน(찬)/ดิฉัน(디찬, 격식). '~이다'는 เป็น(뻰)을 씁니다. 태국 사람은 보통 이름보다 별명(ชื่อเล่น)을 먼저 말합니다.","items":[{"th":"คุณชื่ออะไรครับ","rom":"kun chûue à-rai kráp","ko":"쿤 츠- 아라이 크랍","mean":"이름이 뭐예요?"},{"th":"ผมชื่อ...ครับ","rom":"pǒm chûue ... kráp","ko":"폼 츠- ... 크랍","mean":"제 이름은 ...입니다 (남성)","note":"여성: ฉันชื่อ...ค่ะ (찬 츠- ... 카)"},{"th":"ฉันชื่อ...ค่ะ","rom":"chǎn chûue ... kâ","ko":"찬 츠- ... 카","mean":"제 이름은 ...입니다 (여성)","note":null},{"th":"ผมเป็นคนเกาหลีครับ","rom":"pǒm bpen kon gao-lǐi kráp","ko":"폼 뻰 콘 까올리 크랍","mean":"저는 한국 사람입니다"},{"th":"คุณมาจากไหนครับ","rom":"kun maa jàak nǎi kráp","ko":"쿤 마 짝 나이 크랍","mean":"어디에서 오셨어요?"},{"th":"ผมมาเที่ยวครับ","rom":"pǒm maa tîao kráp","ko":"폼 마 티아오 크랍","mean":"여행 왔어요"},{"th":"ผมทำงานที่นี่ครับ","rom":"pǒm tam-ngaan tîi-nîi kráp","ko":"폼 탐응안 티니 크랍","mean":"여기서 일해요"},{"th":"คุณทำงานอะไรครับ","rom":"kun tam-ngaan à-rai kráp","ko":"쿤 탐응안 아라이 크랍","mean":"무슨 일 하세요?"},{"th":"ผมเป็นครูครับ","rom":"pǒm bpen kruu kráp","ko":"폼 뻰 크루- 크랍","mean":"저는 선생님입니다"},{"th":"ผมกำลังเรียนภาษาไทยครับ","rom":"pǒm gam-lang rian paa-sǎa tai kráp","ko":"폼 깜랑 리안 파싸 타이 크랍","mean":"태국어 공부하고 있어요"},{"th":"พูดไทยนิดหน่อยครับ","rom":"pûut tai nít-nɔ̀i kráp","ko":"풋 타이 닛너이 크랍","mean":"태국어 조금 해요"}]},{"id":3,"title":"못 알아들었을 때 (생존 표현)","goal":"되묻기, 천천히 말해 달라고 하기","tip":"초보 때 가장 많이 쓰는 레슨입니다. 이 6~7문장만 있어도 대화가 끊기지 않습니다. 문장 끝에 ไหม(마이)를 붙이면 '~해 주실래요?' 질문이 됩니다.","items":[{"th":"ไม่เข้าใจครับ","rom":"mâi kâo-jai kráp","ko":"마이 카오짜이 크랍","mean":"이해 못 했어요"},{"th":"เข้าใจแล้วครับ","rom":"kâo-jai léeo kráp","ko":"카오짜이 래우 크랍","mean":"이해했어요"},{"th":"พูดช้าๆ ได้ไหมครับ","rom":"pûut cháa-cháa dâai mǎi kráp","ko":"풋 차차 다이 마이 크랍","mean":"천천히 말해 주실래요?"},{"th":"พูดอีกครั้งได้ไหมครับ","rom":"pûut ìik kráng dâai mǎi kráp","ko":"풋 이-ㄱ 크랑 다이 마이 크랍","mean":"한 번 더 말해 주실래요?"},{"th":"อันนี้ภาษาไทยว่าอะไรครับ","rom":"an-níi paa-sǎa tai wâa à-rai kráp","ko":"안니 파싸 타이 와 아라이 크랍","mean":"이건 태국어로 뭐라고 해요?"},{"th":"ผมไม่รู้ครับ","rom":"pǒm mâi rúu kráp","ko":"폼 마이 루- 크랍","mean":"몰라요"},{"th":"พูดภาษาอังกฤษได้ไหมครับ","rom":"pûut paa-sǎa ang-grìt dâai mǎi kráp","ko":"풋 파싸 앙끄릿 다이 마이 크랍","mean":"영어 할 수 있어요?"},{"th":"ได้","rom":"dâai","ko":"다이","mean":"할 수 있다 / 된다 / 괜찮다"},{"th":"ไม่ได้","rom":"mâi dâai","ko":"마이 다이","mean":"안 된다 / 할 수 없다"}]},{"id":4,"title":"숫자와 가격","goal":"0~100, 가격 묻고 알아듣기","tip":"11은 สิบเอ็ด(씹엣), 21은 ยี่สิบเอ็ด(이씹엣)처럼 일의 자리 1이 เอ็ด(엣)이 됩니다. 20은 สองสิบ(썽씹)이 아니라 ยี่สิบ(이씹). 돈 단위는 บาท(밧).","items":[{"th":"ศูนย์","rom":"sǔun","ko":"순-","mean":"0"},{"th":"หนึ่ง","rom":"nùng","ko":"능","mean":"1"},{"th":"สอง","rom":"sɔ̌ɔng","ko":"썽-","mean":"2"},{"th":"สาม","rom":"sǎam","ko":"쌈-","mean":"3"},{"th":"สี่","rom":"sìi","ko":"씨-","mean":"4"},{"th":"ห้า","rom":"hâa","ko":"하-","mean":"5"},{"th":"หก","rom":"hòk","ko":"혹","mean":"6"},{"th":"เจ็ด","rom":"jèt","ko":"쩻","mean":"7"},{"th":"แปด","rom":"bpɛ̀ɛt","ko":"뺏-","mean":"8"},{"th":"เก้า","rom":"gâao","ko":"까오","mean":"9"},{"th":"สิบ","rom":"sìp","ko":"씹","mean":"10"},{"th":"สิบเอ็ด","rom":"sìp-èt","ko":"씹엣","mean":"11"},{"th":"ยี่สิบ","rom":"yîi-sìp","ko":"이-씹","mean":"20"},{"th":"ห้าสิบ","rom":"hâa-sìp","ko":"하-씹","mean":"50"},{"th":"หนึ่งร้อย","rom":"nùng rɔ́ɔi","ko":"능 러-이","mean":"100"},{"th":"หนึ่งพัน","rom":"nùng pan","ko":"능 판","mean":"1,000"},{"th":"บาท","rom":"bàat","ko":"밧-","mean":"바트 (태국 화폐 단위)"},{"th":"เท่าไหร่","rom":"tâo-rài","ko":"타오라이","mean":"얼마"}]},{"id":5,"title":"쇼핑·흥정","goal":"가격 묻기, 깎기, 카드 결제","tip":"시장·노점에서는 흥정이 일반적이지만 편의점·백화점·정찰제 가게에서는 하지 않습니다. 웃으면서 '조금만 깎아 주세요' 하는 것이 포인트입니다.","items":[{"th":"อันนี้เท่าไหร่ครับ","rom":"an-níi tâo-rài kráp","ko":"안니 타오라이 크랍","mean":"이거 얼마예요?"},{"th":"แพงไปครับ","rom":"pɛɛng bpai kráp","ko":"팽- 빠이 크랍","mean":"너무 비싸요"},{"th":"ลดหน่อยได้ไหมครับ","rom":"lót nɔ̀i dâai mǎi kráp","ko":"롯 너이 다이 마이 크랍","mean":"좀 깎아 주실래요?"},{"th":"ถูกกว่านี้ได้ไหมครับ","rom":"tùuk gwàa níi dâai mǎi kráp","ko":"툭- 꽈- 니 다이 마이 크랍","mean":"이것보다 싸게 되나요?"},{"th":"ขอดูหน่อยครับ","rom":"kɔ̌ɔ duu nɔ̀i kráp","ko":"커- 두- 너이 크랍","mean":"좀 보여 주세요"},{"th":"เอาอันนี้ครับ","rom":"ao an-níi kráp","ko":"아오 안니 크랍","mean":"이걸로 할게요"},{"th":"ไม่เอาครับ","rom":"mâi ao kráp","ko":"마이 아오 크랍","mean":"필요 없어요 / 안 살게요"},{"th":"มีสีอื่นไหมครับ","rom":"mii sǐi uèuen mǎi kráp","ko":"미- 씨- 응- 마이 크랍","mean":"다른 색 있어요?"},{"th":"ใช้บัตรได้ไหมครับ","rom":"chái bàt dâai mǎi kráp","ko":"차이 밧 다이 마이 크랍","mean":"카드 되나요?"},{"th":"ขอถุงด้วยครับ","rom":"kɔ̌ɔ tǔng dûuai kráp","ko":"커- 퉁 두어이 크랍","mean":"봉지 주세요"}]},{"id":6,"title":"식당·음식 주문","goal":"메뉴 주문, 맵기 조절, 계산","tip":"매운 정도를 말하지 않으면 한국인에게도 매울 수 있습니다. ไม่เผ็ด(안 맵게), เผ็ดน้อย(조금 맵게)를 꼭 외우세요. 고수는 ผักชี(팍치). 문장 끝 ด้วย(두어이)는 '~해 주세요'의 부드러운 부탁입니다.","items":[{"th":"ขอเมนูหน่อยครับ","rom":"kɔ̌ɔ mee-nuu nɔ̀i kráp","ko":"커- 메-누- 너이 lts?search_query=Learn+Thai+with+Mod","desc":"초중급 회화를 설명 위주로 알려 주는 채널. 검색 결과에서 채널을 확인하세요."},{"cat":"듣기·강의","title":"Thai Language Hut (YouTube/웹)","url":"https://www.youtube.com/results?search_query=Thai+Language+Hut","desc":"상황별 표현과 문자 설명."},{"cat":"듣기·강의","title":"YouTube: 태국어 회화 (한국어 설명)","url":"https://www.youtube.com/results?search_query=%ED%83%9C%EA%B5%AD%EC%96%B4+%ED%9A%8C%ED%99%94+%EA%B8%B0%EC%B4%88","desc":"한국어로 설명하는 입문 영상을 찾을 때."},{"cat":"사전·도구","title":"Thai-language.com","url":"https://www.thai-language.com","desc":"영어-태국어 온라인 사전. 단어 발음/성조/예문이 풍부한 학습자 사이트."},{"cat":"사전·도구","title":"네이버 태국어 사전","url":"https://dict.naver.com/thkodict/","desc":"태국어-한국어 사전. 모르는 단어를 한국어로 바로 확인."},{"cat":"사전·도구","title":"Google 번역 (태국어→한국어)","url":"https://translate.google.com/?sl=th&tl=ko","desc":"읽기/듣기 확인용. 번역을 믿기보다 보조로."},{"cat":"사전·도구","title":"Duolingo (태국어)","url":"https://www.duolingo.com","desc":"가볍게 매일 습관 만들기용. 회화 깊이는 얕으니 보조로 사용."},{"cat":"말하기 파트너","title":"italki","url":"https://www.italki.com","desc":"태국인 튜터 1:1 수업. 체험 수업으로 튜터를 비교해 보세요."},{"cat":"말하기 파트너","title":"Preply","url":"https://preply.com","desc":"1:1 튜터 플랫폼."},{"cat":"말하기 파트너","title":"HelloTalk","url":"https://www.hellotalk.com","desc":"태국인과 언어 교환(채팅/음성)."},{"cat":"말하기 파트너","title":"Tandem","url":"https://tandem.net","desc":"언어 교환 앱."},{"cat":"비즈니스 (공식 기관)","title":"태국 투자청 BOI","url":"https://www.boi.go.th","desc":"투자 인센티브, 외국인 투자 절차 공식 안내."},{"cat":"비즈니스 (공식 기관)","title":"태국 상무부 사업개발국(DBD)","url":"https://www.dbd.go.th","desc":"법인 등록, 사업 관련 공식 정보."},{"cat":"비즈니스 (공식 기관)","title":"KOTRA","url":"https://www.kotra.or.kr","desc":"태국 시장 정보와 방콕 무역관 자료를 찾을 때."},{"cat":"비즈니스 (공식 기관)","title":"주태국 대한민국 대사관","url":"https://overseas.mofa.go.kr/th-ko/index.do","desc":"영사·비자·안전 공지."},{"cat":"비즈니스 태국어 학습","title":"YouTube: Thai business etiquette","url":"https://www.youtube.com/results?search_query=Thai+business+etiquette","desc":"비즈니스 매너 영상을 검색합니다."},{"cat":"비즈니스 태국어 학습","title":"YouTube: 비즈니스 태국어","url":"https://www.youtube.com/results?search_query=%EB%B9%84%EC%A6%88%EB%8B%88%EC%8A%A4+%ED%83%9C%EA%B5%AD%EC%96%B4","desc":"한국어로 된 비즈니스 태국어 영상을 찾을 때."},{"cat":"비즈니스 태국어 학습","title":"italki: Thai business 튜터 검색","url":"https://www.italki.com/en/teachers/thai","desc":"튜터 프로필에서 'business'를 검색해 비즈니스 롤플레이 가능한 튜터를 고르세요."}],"manners":[["합장 인사 (ไหว้, 와이)","두 손바닥을 모아 가슴~얼굴 높이에서 가볍게 고개를 숙입니다. 상대가 먼저 하면 같이 합장하며 인사하세요. 지위나 나이가 높은 사람에게는 손 위치가 높아집니다. 외국인에게는 악수도 흔하지만 상대가 와이를 하면 답례하는 것이 무난합니다."],["호칭","성 대신 이름을 부르며 앞에 คุณ(쿤)을 붙입니다. 태국 사람은 공식 이름 외에 짧은 별명(ชื่อเล่น)을 두루 쓰므로 명함의 이름과 별명을 함께 물어 두면 좋습니다."],["명함","받을 때는 두 손 또는 오른손으로 정중하게 받고, 바로 넣지 말고 한 번 읽어 본 뒤 테이블이나 명함 지갑에 둡니다. 태국어·영어 양면 명함이 널리 쓰입니다."],["머리와 발","머리는 신성하게, 발은 낮게 여깁니다. 남의 머리를 만지거나 발로 물건을 가리키거나 옮기는 행동은 피하세요. 앉을 때 발바닥이 상대를 향하지 않게 하세요."],["왕실과 불교","왕실에 대한 농담이나 비판은 큰 문제가 될 수 있습니다. 불상이나 승려를 존중하세요. 승려와 이성의 신체 접촉은 하지 않습니다."],["체면과 배려","공개 석상에서 면박을 주거나 크게 화를 내면 관계가 크게 상합니다. กรุณา·เกรงใจ(끄렝짜이, 상대를 불편하게 하지 않으려는 배려)와 ใจเย็น(짜이옌, 침착함)이 중요한 가치입니다. 부정적인 말은 사적인 자리에서 부드럽게 전하세요."],["'네'가 동의가 아닐 수 있음","ได้ครับ나 ครับ가 반드시 '동의/약속'을 뜻하지는 않습니다. 중요한 합의는 숫자와 날짜를 되풀이해 확인하고, 이메일이나 라인으로 기록을 남기세요."],["시간","방콕은 교통체증이 심해서 이동 시간을 넉넉히 잡아야 합니다. 약속 시각은 지키되 상대가 늦을 수 있음을 감안하세요. 불교 공휴일, 송끄란(4월 중순), 연말연시 일정은 미리 확인하세요."],["복장","처음 만날 때는 단정한 복장이 좋습니다. 덥더라도 지나치게 노출된 옷은 피하세요. 장례에서는 검은색 또는 흰색 옷을 입습니다."],["식사와 술","초대한 사람이 계산하는 경우가 많습니다. 식사 자리는 관계 형성의 시간이라 바로 업무 이야기를 꺼내기보다 가벼운 대화로 시작하세요. 술을 못 마시면 'ผมไม่ดื่มครับ'로 정중히 사양하세요."],["연락 수단","LINE 메신저가 업무에서도 널리 쓰입니다. 연락처 교환 시 전화번호와 LINE ID를 함께 받아 두세요."],["법률·세무","외국인 사업 규정, 투자 인센티브, 비자·워크퍼밋, 세금은 수시로 바뀝니다. 계약 전에는 현지 변호사·회계사와 공식 기관(BOI, 상무부 사업개발국 등)에서 최신 내용을 확인하세요."]]};
const $ = (s,r=document)=>r.querySelector(s);
const store = {
  get(){try{return JSON.parse(localStorage.getItem('thai_v1'))||{}}catch(e){return {}}},
  set(o){localStorage.setItem('thai_v1',JSON.stringify(o))}
};
let S = store.get(); S.checks=S.checks||{}; S.done=S.done||{}; S.box=S.box||{}; S.best=S.best||{}; S.show=S.show||{rom:true,ko:true,mean:true};
const save=()=>store.set(S);

// ----- audio (브라우저 내장 태국어 음성 사용) -----
function thVoice(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];return vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('th'))||null;}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=()=>{const e=document.getElementById('vstat');if(e)e.innerHTML=vstat();};}
function vstat(){const v=thVoice();return v?`✅ 태국어 음성 사용 중: ${v.name}`:'⚠️ 이 브라우저에서 태국어 음성을 찾지 못했습니다. Mac은 시스템 설정 > 손쉬운 사용 > 말하기 콘텐츠 > 시스템 음성 > 관리에서 "Thai (Kanya)"를 내려받으면 됩니다.';}
function play(text){return tts(text);}
function tts(text){
  return new Promise(res=>{
    if(!window.speechSynthesis){res();return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';
    const v=thVoice();if(v)u.voice=v;
    u.rate=+(localStorage.getItem('thai_rate')||0.85);
    u.onend=res;u.onerror=res;
    speechSynthesis.speak(u);
  });
}

let rec=null, recChunks=[], recBtn=null;
async function toggleRec(btn){
  if(rec&&rec.state==='recording'){rec.stop();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st);recChunks=[];recBtn=btn;
    rec.ondataavailable=e=>recChunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());btn.classList.remove('rec');btn.textContent='🎤';
      const a=new Audio(URL.createObjectURL(new Blob(recChunks,{type:'audio/webm'})));a.play();};
    rec.start();btn.classList.add('rec');btn.textContent='⏹';
    setTimeout(()=>{if(rec.state==='recording')rec.stop();},8000);
  }catch(e){alert('마이크 권한이 필요합니다. 브라우저에서 마이크를 허용해 주세요.');}
}

function pickCard(deck){
  const ws=deck.map(c=>{const b=S.box[c.id]??0;return Math.pow(0.45,b)+0.05;});
  const sum=ws.reduce((a,b)=>a+b,0);let r=Math.random()*sum;
  for(let i=0;i<deck.length;i++){r-=ws[i];if(r<=0)return deck[i];}return deck[0];
}

   <div class="grid" style="margin-top:10px">
    <button class="b" onclick="startQuiz('listen')">🔊 듣고 뜻 맞히기<br><small>최고 ${S.best.listen??'-'}/10</small></button>
    <button class="b" onclick="startQuiz('read')">🇰🇷 뜻 보고 태국어 고르기<br><small>최고 ${S.best.read??'-'}/10</small></button>
    <button class="b" onclick="startQuiz('tone')">🎵 성조 구분<br><small>최고 ${S.best.tone??'-'}/10</small></button>
   </div></div><div id="qbox"></div>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(mode){
  const dl=$('#qd').value;let pool=ALL.filter(c=>dl==='all'||c.lesson==dl);
  if(mode!=='tone'&&pool.length<4)pool=ALL;
  let qs;
  if(mode==='tone'){
    const names=DATA.toneDrills;
    qs=shuffle(names).slice(0,10).map(d=>({audio:d[0],prompt:'들리는 단어의 성조는?',answer:d[3],opts:shuffle(['평성','저성','하성','고성','상성']),extra:`${d[0]} ${d[1]} (${d[2]})`}));
  } else {
    qs=shuffle(pool).slice(0,10).map(c=>{
      const wrong=shuffle(ALL.filter(x=>x.id!==c.id&&x.mean!==c.mean)).slice(0,3);
      if(mode==='listen')return {audio:say(c),prompt:'🔊 소리를 듣고 뜻을 고르세요',answer:c.mean,opts:shuffle([c,...wrong].map(x=>x.mean)),extra:`${c.th} · ${c.rom}`};
      return {prompt:`"${c.mean}" 를 태국어로 하면?`,answer:c.th,opts:shuffle([c,...wrong].map(x=>x.th)),extra:`${c.rom} (${c.ko})`,thOpts:true,audioAfter:say(c)};
    });
  }
  Q={mode,qs,i:0,score:0,wrongs:[]};showQ();
}
function showQ(){
  const q=Q.qs[Q.i];
  if(!q){
    S.best[Q.mode]=Math.max(S.best[Q.mode]||0,Q.score);save();
    $('#qbox').innerHTML=`<div class="card"><h2>결과 ${Q.score}/${Q.qs.length}</h2>
     ${Q.wrongs.length?`<h3>틀린 문제</h3>${Q.wrongs.map(w=>`<div class="item"><div class="txt">${w}</div></div>`).join('')}`:'<p>전부 맞혔어요! 🎉</p>'}
     <button class="b" onclick="quiz()">다시 하기</button></div>`;return;
  }
  $('#qbox').innerHTML=`<div class="card"><div class="muted">${Q.i+1} / ${Q.qs.length} · 점수 ${Q.score}</div>
   <h3>${q.prompt}</h3>${q.audio?`<button class="ic" style="width:52px;height:52px;font-size:24px" onclick="play('${q.audio}')">🔊</button>`:''}
   <div id="opts">${q.opts.map((o,i)=>`<button class="opt ${q.thOpts?'th big':''}" onclick="answer(${i})">${o}</button>`).join('')}</div>
   <div id="fb"></div></div>`;
  if(q.audio)play(q.audio);
}
function answer(i){
  const q=Q.qs[Q.i];const ok=q.opts[i]===q.answer;
  document.querySelectorAll('#opts .opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.answer)b.classList.add('good');else if(j===i)b.classList.add('bad');});
  if(ok)Q.score++;else Q.wrongs.push(`${q.extra} → 정답: ${q.answer}`);
  if(q.audioAfter)play(q.audioAfter);
  $('#fb').innerHTML=`<p>${ok?'✅ 정답!':'❌ 오답'} <span class="muted">${q.extra}</span></p><button class="b" onclick="Q.i++;showQ()">${Q.i+1>=Q.qs.length?'결과 보기':'다음'}</button>`;
}
function res(){
  const cats=[...new Set(DATA.resources.map(r=>r.cat))];
  $('#main').innerHTML=`<div class="card"><h2>추가 자료·도구</h2><p class="muted">이 코스를 보완해 줄 외부 자료입니다. 요금/서비스 내용은 변동될 수 있으니 가입 전에 직접 확인하세요.</p></div>`+
  cats.map(c=>`<div class="card"><h3>${c}</h3>${DATA.resources.filter(r=>r.cat===c).map(r=>`<div class="item"><div class="txt"><a href="${r.url}" target="_blank" rel="noopener"><b>${r.title}</b></a><div class="muted">${r.desc}</div></div></div>`).join('')}</div>`).join('')+
  `<div class="card"><h3>실전 팁</h3><ul><li>모르는 표현은 이 코스의 복습 카드 형식으로 직접 추가하세요(메모 + 녹음).</li><li>튜터 수업 전에 '오늘 말하고 싶은 문장 5개'를 준비하면 수업 효율이 2배 됩니다.</li><li>이 코스의 음성은 브라우저/OS에 내장된 합성 음성입니다. 억양과 리듬은 반드시 원어민 영상/튜터로 교차 확인하세요.</li></ul></div>`;
}
nav();
</script>
